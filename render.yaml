services:
  - type: web
    name: my-website-api
    runtime: node
    region: oregon
    plan: starter
    rootDir: my-app/server
    buildCommand: npm ci
    startCommand: npm start
    autoDeploy: true
    disk:
      name: app-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /var/data/database.sqlite
      - key: APP_URL
        fromService:
          type: web
          name: my-website-site
          property: host
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
  - type: web
    name: my-website-site
    runtime: static
    rootDir: Website
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_HOST
        fromService:
          type: web
          name: my-website-api
          property: host
